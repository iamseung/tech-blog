name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload_pages:
        description: Upload the verified production output for Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: node_modules/node/bin/node node_modules/playwright/cli.js install --with-deps chromium
      - name: Check, unit tests, production build and both browser bases
        run: npm run verify
      - name: Upload the same verified production output
        if: ${{ inputs.upload_pages == true && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

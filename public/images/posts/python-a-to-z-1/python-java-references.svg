<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img">
  <title>Python과 Java의 변수와 객체</title>
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#135E73"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#9A5A0A"/></marker>
  </defs>
  <rect width="960" height="410" rx="12" fill="#FAFAF8" stroke="#D9D8DE"/>
  <path d="M480,24 V386" stroke="#D9D8DE" stroke-dasharray="4 4"/>

  <text x="30" y="44" font-size="15" font-weight="700" fill="#135E73">Python · 이름을 객체에 연결</text>
  <text x="30" y="64" font-size="12" fill="#6B6B70">변수는 이름표, 대입은 같은 객체에 이름표를 하나 더 붙이는 일</text>
  <text x="30" y="100" font-size="12" font-weight="600" fill="#1D1D1F">alias = original</text>
  <g font-size="13" text-anchor="middle" fill="#1D1D1F">
    <rect x="30" y="114" width="110" height="36" rx="6" fill="#E3EEF1" stroke="#9CC3CE"/><text x="85" y="137">original</text>
    <rect x="30" y="170" width="110" height="36" rx="6" fill="#E3EEF1" stroke="#9CC3CE"/><text x="85" y="193">alias</text>
  </g>
  <rect x="250" y="118" width="200" height="84" rx="6" fill="#FFFFFF" stroke="#135E73" stroke-width="1.5"/>
  <text x="266" y="144" font-size="12" fill="#6B6B70">list 객체</text>
  <text x="266" y="176" font-size="14" font-weight="600" fill="#1D1D1F">[1042, 1043, 1044]</text>
  <text x="30" y="254" font-size="12" font-weight="600" fill="#1D1D1F">amount = 1000 · backup = amount</text>
  <g font-size="13" text-anchor="middle" fill="#1D1D1F">
    <rect x="30" y="268" width="110" height="36" rx="6" fill="#E3EEF1" stroke="#9CC3CE"/><text x="85" y="291">amount</text>
    <rect x="30" y="318" width="110" height="36" rx="6" fill="#E3EEF1" stroke="#9CC3CE"/><text x="85" y="341">backup</text>
  </g>
  <rect x="250" y="276" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#135E73" stroke-width="1.5"/>
  <text x="266" y="302" font-size="12" fill="#6B6B70">int 객체</text>
  <text x="266" y="330" font-size="14" font-weight="600" fill="#1D1D1F">1000</text>
  <g stroke="#135E73" stroke-width="1.8" fill="none">
    <path d="M140,132 C190,132 200,150 246,150" marker-end="url(#t)"/>
    <path d="M140,188 C190,188 200,170 246,170" marker-end="url(#t)"/>
    <path d="M140,286 C190,286 200,302 246,302" marker-end="url(#t)"/>
    <path d="M140,336 C190,336 200,320 246,320" marker-end="url(#t)"/>
  </g>
  <text x="30" y="382" font-size="12" fill="#6B6B70">정수도 객체다. amount += 500 은 이름을 새 객체 1500 에 다시 연결한다.</text>

  <text x="510" y="44" font-size="15" font-weight="700" fill="#9A5A0A">Java · 참조 값을 복사</text>
  <text x="510" y="64" font-size="12" fill="#6B6B70">참조형 변수는 참조 값을, 기본형 변수는 값 자체를 담는다</text>
  <text x="510" y="100" font-size="12" font-weight="600" fill="#1D1D1F">var alias = original;</text>
  <g font-size="13" text-anchor="middle" fill="#1D1D1F">
    <rect x="510" y="114" width="110" height="36" rx="6" fill="#FBF3E6" stroke="#D9B98A"/><text x="565" y="137">original</text>
    <rect x="510" y="170" width="110" height="36" rx="6" fill="#FBF3E6" stroke="#D9B98A"/><text x="565" y="193">alias</text>
  </g>
  <rect x="730" y="118" width="200" height="84" rx="6" fill="#FFFFFF" stroke="#9A5A0A" stroke-width="1.5"/>
  <text x="746" y="144" font-size="12" fill="#6B6B70">ArrayList 객체</text>
  <text x="746" y="176" font-size="14" font-weight="600" fill="#1D1D1F">[1042, 1043, 1044]</text>
  <g stroke="#9A5A0A" stroke-width="1.8" fill="none">
    <path d="M620,132 C670,132 680,150 726,150" marker-end="url(#o)"/>
    <path d="M620,188 C670,188 680,170 726,170" marker-end="url(#o)"/>
  </g>
  <text x="510" y="254" font-size="12" font-weight="600" fill="#1D1D1F">int amount = 1000; int backup = amount;</text>
  <rect x="510" y="276" width="190" height="70" rx="6" fill="#FBF3E6" stroke="#D9B98A"/>
  <text x="526" y="302" font-size="12" fill="#6B6B70">amount</text>
  <text x="526" y="330" font-size="14" font-weight="600" fill="#1D1D1F">1000</text>
  <rect x="730" y="276" width="200" height="70" rx="6" fill="#FBF3E6" stroke="#D9B98A"/>
  <text x="746" y="302" font-size="12" fill="#6B6B70">backup</text>
  <text x="746" y="330" font-size="14" font-weight="600" fill="#1D1D1F">1000</text>
  <text x="510" y="382" font-size="12" fill="#6B6B70">기본형 변수는 값을 직접 담는다. 가리키는 객체가 없다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img">
  <title>같은 내용과 같은 객체</title>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#6B6B70"/></marker></defs>
  <rect width="960" height="300" rx="12" fill="#FAFAF8" stroke="#D9D8DE"/>
  <text x="30" y="40" font-size="15" font-weight="700" fill="#1D1D1F">같은 내용 ≠ 같은 객체</text>
  <text x="30" y="60" font-size="12" fill="#6B6B70">== 는 값이 같은지, is 는 같은 객체인지 묻는다</text>

  <g font-size="13" text-anchor="middle" fill="#1D1D1F">
    <rect x="30" y="90" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#B5B4BA"/><text x="80" y="112">first</text>
    <rect x="30" y="140" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#B5B4BA"/><text x="80" y="162">alias</text>
    <rect x="30" y="214" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#B5B4BA"/><text x="80" y="236">second</text>
  </g>
  <rect x="230" y="96" width="230" height="72" rx="6" fill="#E3EEF1" stroke="#135E73" stroke-width="1.5"/>
  <text x="246" y="120" font-size="12" font-weight="600" fill="#135E73">리스트 A</text>
  <text x="246" y="150" font-size="14" font-weight="600" fill="#1D1D1F">[1042, 1043]</text>
  <rect x="230" y="196" width="230" height="72" rx="6" fill="#F0ECFB" stroke="#5B3FB8" stroke-width="1.5"/>
  <text x="246" y="220" font-size="12" font-weight="600" fill="#5B3FB8">리스트 B</text>
  <text x="246" y="250" font-size="14" font-weight="600" fill="#1D1D1F">[1042, 1043]</text>
  <g stroke="#6B6B70" stroke-width="1.5" fill="none">
    <path d="M130,107 C175,107 185,122 226,122" marker-end="url(#m)"/>
    <path d="M130,157 C175,157 185,144 226,144" marker-end="url(#m)"/>
    <path d="M130,231 H226" marker-end="url(#m)"/>
  </g>

  <rect x="520" y="84" width="410" height="190" rx="8" fill="#FFFFFF" stroke="#B5B4BA"/>
  <g font-size="14" font-weight="600" fill="#1D1D1F">
    <text x="544" y="130">first == second</text>
    <text x="544" y="190">first is second</text>
    <text x="544" y="250">first is alias</text>
  </g>
  <path d="M536,152 H914 M536,212 H914" stroke="#ECEBEF"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="700" y="112" width="64" height="26" rx="13" fill="#E3F2EF" stroke="#0B6B5E"/><text x="732" y="130" fill="#0B6B5E">True</text>
    <rect x="700" y="172" width="64" height="26" rx="13" fill="#FBEDEA" stroke="#A33A20"/><text x="732" y="190" fill="#A33A20">False</text>
    <rect x="700" y="232" width="64" height="26" rx="13" fill="#E3F2EF" stroke="#0B6B5E"/><text x="732" y="250" fill="#0B6B5E">True</text>
  </g>
  <g font-size="12" fill="#6B6B70">
    <text x="784" y="130">항목 값이 같다</text>
    <text x="784" y="190">서로 다른 리스트</text>
    <text x="784" y="250">같은 리스트 A</text>
  </g>
</svg>

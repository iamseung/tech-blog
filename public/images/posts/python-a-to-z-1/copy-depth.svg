<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img">
  <title>대입, 얕은 복사, 깊은 복사</title>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#6B6B70"/></marker></defs>
  <rect width="960" height="340" rx="12" fill="#FAFAF8" stroke="#D9D8DE"/>
  <rect x="24" y="20" width="296" height="300" rx="8" fill="#FFFFFF" stroke="#B5B4BA"/>
  <text x="40" y="48" font-size="14" font-weight="700" fill="#1D1D1F">1. 대입</text>
  <text x="40" y="68" font-size="12" fill="#6B6B70">alias = order</text>
  <g font-size="13" text-anchor="middle" fill="#1D1D1F"><rect x="40" y="104" width="70" height="32" rx="6" fill="#FAFAF8" stroke="#B5B4BA"/><text x="75" y="125">order</text><rect x="40" y="204" width="70" height="32" rx="6" fill="#FAFAF8" stroke="#B5B4BA"/><text x="75" y="225">alias</text></g>
  <rect x="134" y="145" width="78" height="50" rx="6" fill="#E3EEF1" stroke="#135E73" stroke-width="1.5"/><text x="146" y="166" font-size="13" font-weight="600" fill="#1D1D1F">dict A</text><text x="146" y="184" font-size="11" fill="#6B6B70">items</text>
  <rect x="230" y="150" width="76" height="40" rx="6" fill="#FBF3E6" stroke="#9A5A0A" stroke-width="1.5"/><text x="268" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#1D1D1F">[&#39;book&#39;]</text>
  <g stroke="#6B6B70" stroke-width="1.5" fill="none"><path d="M110,120 C122,120 122,160 130,160" marker-end="url(#m)"/><path d="M110,220 C122,220 122,180 130,180" marker-end="url(#m)"/><path d="M212,170 H226" marker-end="url(#m)"/></g>
  <text x="40" y="276" font-size="12" font-weight="600" fill="#1D1D1F">딕셔너리도 리스트도 공유</text><text x="40" y="298" font-size="12" fill="#6B6B70">alias is order → True</text>
  <rect x="332" y="20" width="296" height="300" rx="8" fill="#FFFFFF" stroke="#B5B4BA"/>
  <text x="348" y="48" font-size="14" font-weight="700" fill="#1D1D1F">2. 얕은 복사</text>
  <text x="348" y="68" font-size="12" fill="#6B6B70">shallow = order.copy()</text>
  <g font-size="13" text-anchor="middle" fill="#1D1D1F"><rect x="348" y="104" width="70" height="32" rx="6" fill="#FAFAF8" stroke="#B5B4BA"/><text x="383" y="125">order</text><rect x="348" y="204" width="70" height="32" rx="6" fill="#FAFAF8" stroke="#B5B4BA"/><text x="383" y="225">shallow</text></g>
  <rect x="442" y="95" width="78" height="50" rx="6" fill="#E3EEF1" stroke="#135E73" stroke-width="1.5"/><text x="454" y="116" font-size="13" font-weight="600" fill="#1D1D1F">dict A</text><text x="454" y="134" font-size="11" fill="#6B6B70">items</text>
  <rect x="442" y="195" width="78" height="50" rx="6" fill="#E3EEF1" stroke="#135E73" stroke-width="1.5"/><text x="454" y="216" font-size="13" font-weight="600" fill="#1D1D1F">dict B</text><text x="454" y="234" font-size="11" fill="#6B6B70">items</text>
  <rect x="538" y="150" width="76" height="40" rx="6" fill="#FBF3E6" stroke="#9A5A0A" stroke-width="1.5"/><text x="576" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#1D1D1F">[&#39;book&#39;]</text>
  <g stroke="#6B6B70" stroke-width="1.5" fill="none"><path d="M418,120 H438" marker-end="url(#m)"/><path d="M418,220 H438" marker-end="url(#m)"/><path d="M520,120 C530,120 526,162 534,162" marker-end="url(#m)"/><path d="M520,220 C530,220 526,178 534,178" marker-end="url(#m)"/></g>
  <text x="348" y="276" font-size="12" font-weight="600" fill="#1D1D1F">바깥만 새로, 내부 리스트는 공유</text><text x="348" y="298" font-size="12" fill="#6B6B70">shallow[&#39;items&#39;] is order[&#39;items&#39;] → True</text>
  <rect x="640" y="20" width="296" height="300" rx="8" fill="#FFFFFF" stroke="#B5B4BA"/>
  <text x="656" y="48" font-size="14" font-weight="700" fill="#1D1D1F">3. 깊은 복사</text>
  <text x="656" y="68" font-size="12" fill="#6B6B70">deep = copy.deepcopy(order)</text>
  <g font-size="13" text-anchor="middle" fill="#1D1D1F"><rect x="656" y="104" width="70" height="32" rx="6" fill="#FAFAF8" stroke="#B5B4BA"/><text x="691" y="125">order</text><rect x="656" y="204" width="70" height="32" rx="6" fill="#FAFAF8" stroke="#B5B4BA"/><text x="691" y="225">deep</text></g>
  <rect x="750" y="95" width="78" height="50" rx="6" fill="#E3EEF1" stroke="#135E73" stroke-width="1.5"/><text x="762" y="116" font-size="13" font-weight="600" fill="#1D1D1F">dict A</text><text x="762" y="134" font-size="11" fill="#6B6B70">items</text>
  <rect x="750" y="195" width="78" height="50" rx="6" fill="#E3EEF1" stroke="#135E73" stroke-width="1.5"/><text x="762" y="216" font-size="13" font-weight="600" fill="#1D1D1F">dict B</text><text x="762" y="234" font-size="11" fill="#6B6B70">items</text>
  <rect x="846" y="100" width="76" height="40" rx="6" fill="#E3F2EF" stroke="#0B6B5E" stroke-width="1.5"/><text x="884" y="125" font-size="12" font-weight="600" text-anchor="middle" fill="#1D1D1F">[&#39;book&#39;]</text>
  <rect x="846" y="200" width="76" height="40" rx="6" fill="#E3F2EF" stroke="#0B6B5E" stroke-width="1.5"/><text x="884" y="225" font-size="12" font-weight="600" text-anchor="middle" fill="#1D1D1F">[&#39;book&#39;]</text>
  <g stroke="#6B6B70" stroke-width="1.5" fill="none"><path d="M726,120 H746" marker-end="url(#m)"/><path d="M726,220 H746" marker-end="url(#m)"/><path d="M828,120 H842" marker-end="url(#m)"/><path d="M828,220 H842" marker-end="url(#m)"/></g>
  <text x="656" y="276" font-size="12" font-weight="600" fill="#1D1D1F">바깥과 내부 리스트를 모두 새로</text><text x="656" y="298" font-size="12" fill="#6B6B70">deep[&#39;items&#39;] is order[&#39;items&#39;] → False</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img">
  <title>Java와 Python의 컴파일 시점</title>
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#135E73"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#9A5A0A"/></marker>
  </defs>
  <rect width="960" height="300" rx="12" fill="#FAFAF8" stroke="#D9D8DE"/>
  <text x="30" y="40" font-size="15" font-weight="700" fill="#1D1D1F">같은 바이트코드, 다른 컴파일 시점</text>
  <g font-size="12" font-weight="600" fill="#6B6B70" text-anchor="middle">
    <text x="270" y="74">빌드할 때 · 개발자 PC, CI</text>
    <text x="705" y="74">실행할 때 · 서버에서 프로그램 시작</text>
  </g>
  <path d="M455,58 V256" stroke="#D9D8DE" stroke-dasharray="4 4"/>
  <text x="30" y="130" font-size="15" font-weight="700" fill="#9A5A0A">Java</text>
  <text x="30" y="220" font-size="15" font-weight="700" fill="#135E73">Python</text>
  <rect x="110" y="96" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#B5B4BA"/><text x="150" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">.java</text><text x="150" y="138" font-size="11" text-anchor="middle" fill="#6B6B70">소스</text>
  <rect x="215" y="96" width="110" height="56" rx="6" fill="#FBF3E6" stroke="#9A5A0A"/><text x="270" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">javac 컴파일</text><text x="270" y="138" font-size="11" text-anchor="middle" fill="#6B6B70">빌드 단계</text>
  <rect x="350" y="96" width="85" height="56" rx="6" fill="#FFFFFF" stroke="#9A5A0A"/><text x="392" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">.class</text><text x="392" y="138" font-size="11" text-anchor="middle" fill="#6B6B70">바이트코드</text>
  <rect x="480" y="96" width="150" height="56" rx="6" fill="#FFFFFF" stroke="#9A5A0A"/><text x="555" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">JVM 실행</text><text x="555" y="138" font-size="11" text-anchor="middle" fill="#6B6B70">바이트코드 해석</text>
  <rect x="660" y="96" width="270" height="56" rx="6" fill="#FBF3E6" stroke="#9A5A0A"/><text x="795" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">JIT 컴파일</text><text x="795" y="138" font-size="11" text-anchor="middle" fill="#6B6B70">자주 실행되는 코드는 기계어로</text>
  <rect x="110" y="186" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#B5B4BA"/><text x="150" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">.py</text><text x="150" y="228" font-size="11" text-anchor="middle" fill="#6B6B70">소스</text>
  <rect x="480" y="186" width="150" height="56" rx="6" fill="#E3EEF1" stroke="#135E73"/><text x="555" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">CPython 컴파일</text><text x="555" y="228" font-size="11" text-anchor="middle" fill="#6B6B70">바이트코드 생성</text>
  <rect x="660" y="186" width="270" height="56" rx="6" fill="#FFFFFF" stroke="#135E73"/><text x="795" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">실행기</text><text x="795" y="228" font-size="11" text-anchor="middle" fill="#6B6B70">바이트코드를 하나씩 해석</text>
  <g stroke="#9A5A0A" stroke-width="1.8" fill="none">
    <path d="M190,124 H211" marker-end="url(#o)"/><path d="M325,124 H346" marker-end="url(#o)"/>
    <path d="M435,124 H476" marker-end="url(#o)"/><path d="M630,124 H656" marker-end="url(#o)"/>
  </g>
  <text x="456" y="116" font-size="11" text-anchor="middle" fill="#9A5A0A">배포</text>
  <g stroke="#135E73" stroke-width="1.8" fill="none">
    <path d="M190,214 H476" marker-end="url(#t)"/><path d="M630,214 H656" marker-end="url(#t)"/>
  </g>
  <text x="322" y="206" font-size="12" text-anchor="middle" fill="#135E73">소스 그대로 배포 · 빌드 단계의 컴파일 없음</text>
  <text x="30" y="282" font-size="12" fill="#6B6B70">둘 다 컴파일한다. 차이는 컴파일 시점(빌드 vs 실행)과, 실행 중에 기계어까지 바꾸는 JIT 가 기본으로 있는지다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img">
  <title>키워드 전용 인자</title>
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#135E73"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#5B3FB8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9z" fill="#0B6B5E"/></marker>
  </defs>
  <rect width="960" height="290" rx="12" fill="#FAFAF8" stroke="#D9D8DE"/>
  <text x="30" y="36" font-size="14" font-weight="700" fill="#1D1D1F">단독 * : 여기부터는 이름을 붙여 전달한다</text>
  <g font-size="15" font-weight="600" fill="#1D1D1F">
    <text x="30" y="80">def total_amount(</text>
    <text x="360" y="80">,</text>
    <text x="420" y="80">,</text>
    <text x="635" y="80">) -&gt; int:</text>
  </g>
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#1D1D1F">
    <rect x="185" y="56" width="170" height="38" rx="6" fill="#E3EEF1" stroke="#135E73" stroke-width="1.5"/><text x="270" y="80">prices: list[int]</text>
    <rect x="375" y="56" width="40" height="38" rx="6" fill="#F0ECFB" stroke="#5B3FB8" stroke-width="1.5"/><text x="395" y="84" font-size="20" font-weight="700" fill="#5B3FB8">*</text>
    <rect x="435" y="56" width="190" height="38" rx="6" fill="#E3F2EF" stroke="#0B6B5E" stroke-width="1.5"/><text x="530" y="80">shipping: int = 0</text>
  </g>
  <g stroke-width="1.6" fill="none">
    <path d="M270,94 V136" stroke="#135E73" marker-end="url(#t)"/>
    <path d="M395,94 V136" stroke="#5B3FB8" marker-end="url(#p)"/>
    <path d="M530,94 C530,118 660,112 660,136" stroke="#0B6B5E" marker-end="url(#g)"/>
  </g>

  <rect x="30" y="140" width="290" height="100" rx="8" fill="#FFFFFF" stroke="#135E73"/>
  <text x="46" y="166" font-size="13" font-weight="700" fill="#135E73">위치 또는 이름으로 전달</text>
  <text x="46" y="192" font-size="12" fill="#1D1D1F">total_amount([12000, 27000])</text>
  <text x="46" y="214" font-size="12" fill="#1D1D1F">total_amount(prices=[12000, 27000])</text>

  <rect x="335" y="140" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#5B3FB8"/>
  <text x="351" y="166" font-size="13" font-weight="700" fill="#5B3FB8">구분선 · 인자 이름이 아니다</text>
  <text x="351" y="192" font-size="12" fill="#1D1D1F">여기부터는 이름을 붙여 전달</text>
  <text x="351" y="214" font-size="12" fill="#6B6B70">곱셈 기호로 읽지 않는다</text>

  <rect x="600" y="140" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#0B6B5E"/>
  <text x="616" y="166" font-size="13" font-weight="700" fill="#0B6B5E">이름으로만 전달 · 생략하면 0</text>
  <text x="616" y="192" font-size="12" fill="#1D1D1F">total_amount([...], shipping=3000) → 42000</text>
  <text x="616" y="214" font-size="12" fill="#A33A20">total_amount([...], 3000) → TypeError</text>

  <text x="30" y="270" font-size="12" fill="#6B6B70">TypeError 는 함수 본문이 실행되기 전, 전달한 인자를 매개변수에 연결하는 단계에서 발생한다.</text>
</svg>

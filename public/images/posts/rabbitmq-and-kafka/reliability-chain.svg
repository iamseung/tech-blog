    <circle cx="610" cy="250" r="11" fill="#1D1D1F"/><text x="610" y="254" fill="#FFFFFF" font-size="11">4</text><text x="630" y="280">prefetch</text>
    <circle cx="785" cy="250" r="11" fill="#1D1D1F"/><text x="785" y="254" fill="#FFFFFF" font-size="11">5</text><text x="785" y="280">manual ack</text>
